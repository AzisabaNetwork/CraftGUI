name: CraftGUI
version: '${version}'
main: net.azisaba.craftgui.CraftGUI
api-version: '1.13'
author: albardoo02
softdepend:
  - MythicMobs
  - ItemStash
  - StorageBox

commands:
  craftgui:
    description: クラフトGUIを開きます
    usage: /craftgui
    aliases:
      - rgui
      - /rgui
      - ragui
      - /ragui
      - /craft

permissions:
  craftgui.admin:
    default: op
